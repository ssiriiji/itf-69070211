<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1677d2" />
  <title>FOODPICKER ITF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --blue: #1677d2; --coral: #f05b61; --ink: #233042; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Kanit", sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #f4f9ff 0%, #fff7f4 100%);
    }
    .navbar {
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 6vw;
      color: #fff;
      background: var(--blue);
      box-shadow: 0 2px 12px rgba(16, 79, 148, .22);
    }
    .navbar span { font-size: .95rem; font-weight: 500; }
    .navbar__brand { font-size: 1.2rem !important; font-weight: 700 !important; letter-spacing: .5px; }
    .navbar__right { text-align: right; }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 96px 20px 32px;
    }
    .intro { margin: 0 0 18px; color: #657386; font-size: 1.05rem; }
    .food-card {
      width: min(100%, 430px);
      overflow: hidden;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(60, 85, 114, .16);
      animation: appear .35s ease both;
    }
    .image-wrap { position: relative; height: 255px; background: #e8eef5; overflow: hidden; }
    .image-wrap::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 55%, rgba(20, 30, 45, .22)); pointer-events: none; }
    #foodImage { width: 100%; height: 100%; display: block; object-fit: cover; transition: opacity .18s ease, transform .4s ease; }
    .food-card:hover #foodImage { transform: scale(1.035); }
    .food-content { padding: 22px 25px 25px; }
    h1 { margin: 0 0 7px; font-size: 1.7rem; line-height: 1.2; color: #182638; }
    #foodDescription { min-height: 50px; margin: 0 0 16px; color: #697687; line-height: 1.65; }
    .price { display: inline-block; margin: 0; padding: 6px 14px; border-radius: 999px; color: #c8434b; background: #fff0ee; font-size: 1.05rem; font-weight: 600; }
    #randomButton {
      margin-top: 24px;
      border: 0;
      border-radius: 999px;
      padding: 13px 31px;
      font: 600 1.05rem "Kanit", sans-serif;
      color: #fff;
      background: var(--coral);
      box-shadow: 0 7px 15px rgba(240, 91, 97, .3);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }
    #randomButton:hover { background: #e54c54; transform: translateY(-2px); box-shadow: 0 10px 19px rgba(240, 91, 97, .35); }
    #randomButton:active { transform: translateY(1px) scale(.97); box-shadow: 0 3px 8px rgba(240, 91, 97, .28); }
    #randomButton:focus-visible { outline: 3px solid #87bbec; outline-offset: 3px; }
    @keyframes appear { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 480px) {
      .navbar { height: 58px; padding: 0 14px; }
      .navbar span { font-size: .78rem; }
      .navbar__brand { font-size: .95rem !important; }
      main { padding: 80px 16px 28px; }
      .image-wrap { height: 230px; }
      .food-content { padding: 20px; }
    }
  </style>
</head>
<body>
  <nav class="navbar" aria-label="แถบนำทาง">
    <span>69070211</span>
    <span class="navbar__brand">FOODPICKER ITF</span>
    <span class="navbar__right">Week15</span>
  </nav>

  <main>
    <p class="intro">วันนี้กินอะไรดี?</p>
    <article class="food-card" aria-live="polite">
      <div class="image-wrap"><img id="foodImage" src="" alt="" /></div>
      <div class="food-content">
        <h1 id="foodName"></h1>
        <p id="foodDescription"></p>
        <p class="price" id="foodPrice"></p>
      </div>
    </article>
    <button id="randomButton" type="button">สุ่มเมนูอาหาร</button>
  </main>

  <script>
    const foods = [
      { name: "ข้าวมันไก่", description: "ข้าวหอมนุ่ม เสิร์ฟพร้อมไก่ต้มฉ่ำ ๆ และน้ำจิ้มเต้าเจี้ยวรสกลมกล่อม", price: "ราคา 50-65 บาท", image: "https://images.unsplash.com/photo-1562565652-a0d8f0c59eb4?auto=format&fit=crop&w=1000&q=85" },
      { name: "ผัดกะเพรา", description: "ผัดกะเพราร้อน ๆ กลิ่นหอมใบกะเพรา เผ็ดกำลังดี อิ่มอร่อยทุกมื้อ", price: "ราคา 50-70 บาท", image: "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1000&q=85" },
      { name: "ส้มตำ", description: "ส้มตำไทยรสแซ่บ ครบรสเปรี้ยว หวาน เค็ม เผ็ด กินคู่ไก่ย่างก็เข้ากัน", price: "ราคา 45-60 บาท", image: "https://images.unsplash.com/photo-1559847844-5315695dadae?auto=format&fit=crop&w=1000&q=85" },
      { name: "ก๋วยเตี๋ยวเรือ", description: "ก๋วยเตี๋ยวน้ำตกเข้มข้น หอมเครื่องเทศ เลือกเส้นและเนื้อสัตว์ได้ตามใจ", price: "ราคา 50-65 บาท", image: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=1000&q=85" },
      { name: "ข้าวผัด", description: "ข้าวผัดหอมกระทะ เม็ดร่วนกำลังดี พร้อมผักสดและมะนาวเพิ่มความสดชื่น", price: "ราคา 50-65 บาท", image: "https://images.unsplash.com/photo-1512058564366-18510be2db19?auto=format&fit=crop&w=1000&q=85" }
    ];

    const image = document.querySelector("#foodImage");
    const name = document.querySelector("#foodName");
    const description = document.querySelector("#foodDescription");
    const price = document.querySelector("#foodPrice");
    let currentIndex = -1;

    function showFood(index) {
      const food = foods[index];
      image.style.opacity = "0";
      image.src = food.image;
      image.alt = food.name;
      name.textContent = food.name;
      description.textContent = food.description;
      price.textContent = food.price;
      image.onload = () => { image.style.opacity = "1"; };
      image.onerror = () => { image.style.opacity = "1"; };
      currentIndex = index;
    }

    function pickFood() {
      let nextIndex;
      do { nextIndex = Math.floor(Math.random() * foods.length); }
      while (nextIndex === currentIndex);
      showFood(nextIndex);
    }

    document.querySelector("#randomButton").addEventListener("click", pickFood);
    pickFood();
  </script>
</body>
</html>
